[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-gene-set-pipeline"
version = "0.1.0"
description = "Modular pipeline for gene-set scoring in single-cell RNA-seq"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Darwin Xu" }
]
dependencies = [
  "anndata",
  "pandas",
  "numpy",
  "scipy",
  "scikit-learn",
  "pyyaml"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
testpaths = [
  "tests"
]

[tool.setuptools.packages.find]
where = ["src"]
